global:
  scrape_interval: 15s  # معدل سحب البيانات كل 15 ثانية

scrape_configs:
  - job_name: 'node_backend'
    static_configs:
      - targets: ['backend_service:3000'] 
        # ملاحظة: كلمة 'backend' هي اسم خدمة الباك اند في الـ docker-compose، 
        # وسيتقاطع معها Prometheus تلقائياً داخل شبكة الـ Docker المشتركة.