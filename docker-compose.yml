version: '3.8'

services:
  # 1. قاعدة البيانات MongoDB
  mongodb:
    image: mongo:latest
    container_name: mongodb_service
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - mongo_data:/data/db
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # 2. الواجهة الخلفية (Backend) مع WebSocket
  backend:
    build: ./backend
    container_name: backend_service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://admin:admin@mongodb_service:27017/mybasedata?authSource=admin
    depends_on:
      - mongodb
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # 3. خادم الويب Nginx والواجهة الأمامية (Frontend)
  webserver:
    image: nginx:alpine
    container_name: nginx_service
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M

  # 4. مراقبة الأداء Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_service
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # 5. لوحة التحكم Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_service
    restart: always
    ports:
      - "3000:3000"
    networks:
      - app-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  mongo_data:

networks:
  app-net:
    driver: bridge